
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Supplements Garage UG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Supplements Garage UG</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="blog.html">Blog</a>
        </nav>
    </header>

    <main>

        <section class="cart-section">

            <h2>My Shopping Cart</h2>

            <div id="cart-container">

                <p class="empty-cart">
                    Your shopping cart is currently empty.
                </p>

            </div>
            <div class="checkout-details">

    <h3>Delivery Details</h3>

    <label for="customer-name">Full Name:</label>
    <input type="text" id="customer-name" placeholder="Enter your full name">

    <label for="customer-phone">Phone Number:</label>
    <input type="tel" id="customer-phone" placeholder="Enter your phone number">

    <label for="delivery-location">Delivery Location:</label>
    <textarea id="delivery-location" placeholder="Enter your delivery address"></textarea>

</div>

            <div class="cart-summary">

                <h3>Cart Summary</h3>

                <p>
                    Total Items:
                    <span id="cart-count">0</span>
                </p>

                <p>
                    Total Price:
                    <span id="cart-total">UGX 0</span>
                </p>

                <button type="button" id="checkout-button" onclick="checkoutViaWhatsApp()">
    Proceed to Checkout
</button>
                </button>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Supplements Garage UG. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    displayCart();
});
</script>



</body>
</html>
